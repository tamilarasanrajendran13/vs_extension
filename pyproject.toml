[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacompare"
version = "1.0.0"
description = "YAML-driven CSV/XML data comparison framework with HTML reports"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "pyyaml>=6.0",
    "lxml>=5.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
datacompare = "datacompare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
