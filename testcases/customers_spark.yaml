# Identical comparison but using the Spark engine. Requires a Java runtime.
# If Java is not installed, this case raises a clear harness error; switch
# engine back to polars to run without Java.
name: customers_spark_compare
engine: spark
format: csv
source:
  path: ../sample_data/customers_source.csv
target:
  path: ../sample_data/customers_target.csv
key_columns: [customer_id]
options:
  schema_check: true
  null_check: true
  duplicate_check: true
